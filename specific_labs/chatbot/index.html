<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background-color: gainsboro;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
                font-size: 1.4rem;
            }

            button {
                font-size: 1.2rem;
                margin: 12px;
                padding-left: 6px;
                padding-right: 6px;
            }

            button.chatbot {
                background-color: darkslateblue;
                border-radius: 50%;
                color: yellow;
                cursor: pointer; /* Show hand cursor on hover */
                font-size: 48px;
                height: 72px;
                width: 72px;
            }

            div {
                margin-left: 12%;
                margin-right: 12%;
            }

            div#chatbot_area {
                margin: 0%;
            }

            div#chatbot_thread {
                background-color: aliceblue;
                border-radius: 1rem;
                margin-left: 6%;
                margin-right: 48%;
                max-height: 360px;
                min-height: 360px;
                overflow-y: scroll;
            }

            h1 {
                padding: 16px;
            }

            label {
                padding-left: 16px;
            }

            p.ai_message {
                background-color: darkgoldenrod;
                border-radius: 0.5rem;
                margin-bottom: 12px;
                margin-left: 6%;
                margin-right: 32%;
                margin-top: 12px;
                padding: 4px;
                word-wrap: break-word;
            }

            p.error_message {
                background-color: lightcoral;
                border-radius: 0.5rem;
                font-style: italic;
                margin-bottom: 12px;
                margin-left: 6%;
                margin-right: 32%;
                margin-top: 12px;
                padding: 4px;
                word-wrap: break-word;
            }

            p.user_message {
                background-color: darkseagreen;
                border-radius: 0.5rem;
                margin-bottom: 12px;
                margin-left: 32%;
                margin-right: 6%;
                margin-top: 12px;
                padding: 4px;
                word-wrap: break-word;
            }

            textarea#user_message_draft {
                border-radius: 1rem;
                margin-left: 6%;
                margin-right: 48%;
                margin-top: 12px;
                min-width: 36%;
                padding: 4px;
                word-wrap: break-word;
            }
        </style>

        <title>My Account</title>
    </head>

    <body>
        <div>
            <h1>My Account</h1>

            <div id="login_form">
                <label for="username">Username: </label>
                <input id="username" name="username" type="text" />
                <label for="password">Password: </label>
                <input id="password" name="password" type="password" />
                <button id="log_in">Log In</button>
            </div>

            <div hidden id="user_area">
                <button id="log_out" style="margin-left: 80%;">Log Out</button>
                <br />
                <p>Account Balance: <span id="balance">Loading...</span></p>
                <button class="chatbot" id="chatbot">C</button>

                <div hidden id="chatbot_area">
                    <div id="chatbot_thread">
                        <p class="ai_message">Hello! How can I help you today?</p>
                    </div>
                    <textarea id="user_message_draft"></textarea>
                    <button id="send_message">Send Message</button>
                </div>
            </div>
        </div>

        <script>
            // Login function using Cognito - POSTs username/password and returns the user's JWT
            async function login(username, password) {
                const response = await fetch(
                    "https://cognito-idp.us-east-2.amazonaws.com/",
                    {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-amz-json-1.1",
                        "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth"
                    },
                    body: JSON.stringify({
                        AuthFlow: "USER_PASSWORD_AUTH",
                        ClientId: "YOUR_APP_CLIENT_ID",
                        AuthParameters: {
                            USERNAME: username,
                            PASSWORD: password
                        }
                    })
                    }
                );

                const data = await response.json();

                if (!response.ok) {throw new Error(data.message || "Login failed");}

                const idToken = data.AuthenticationResult.IdToken;
                sessionStorage.setItem("idToken", idToken); // used for API calls and cleared on logout
                return idToken;
            }

            // Logs the user session out locally in session storage and remotely with Cognito
            async function logout() {
                // Get the JWT from session storage - returns null if token does not exist
                const accessToken = sessionStorage.getItem("accessToken");

                try {
                    // Attempt logout if the JWT exists
                    if (accessToken) {
                        // Call Cognito GlobalSignOut, which revokes the JWT refresh tokens on all devices
                        await fetch("https://cognito-idp.us-east-2.amazonaws.com/", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/x-amz-json-1.1",
                                "X-Amz-Target": "AWSCognitoIdentityProviderService.GlobalSignOut"
                            },
                            body: JSON.stringify({ AccessToken: accessToken })
                        });
                    }
                } catch (err) {
                    console.error("Sign-out request failed:", err);
                } finally {
                    // Clear local state regardless if remote sign-out succeeds or fails
                    sessionStorage.removeItem("idToken");
                    sessionStorage.removeItem("accessToken");

                    // Restore UI
                    location.reload();
                }
            }

            // Fetch the account balance from the API and display it
            async function loadBalance() {
                // Read the Cognito ID token JWT from the browser session's storage
                const idToken = sessionStorage.getItem("idToken");

                try {
                    // Request the balance from the API
                    const response = await fetch("/api/v1/balance", {
                        headers: { "Authorization": "Bearer " + idToken }
                    });

                    // Handle any errors
                    if (response.status === 401) {
                        throw new Error("Session expired, please log in again");
                    }
                    if (!response.ok) {
                        throw new Error("Could not load balance (" + response.status + ")");
                    }

                    // Format the balance as a USD and display it
                    const data = await response.json();
                    document.getElementById("balance").innerText = new Intl.NumberFormat("en-US", {
                        style: "currency",
                        currency: "USD"
                    }).format(data.balance);
                } catch (err) {
                    console.error("Balance load failed:", err);
                    document.getElementById("balance").innerText = "Unavailable";
                }
            }

            // Send a message to the chatbot
            async function sendMessage(messageText) {
                // Retrieve the JWT from session storage
                const idToken = sessionStorage.getItem("idToken");

                // Call the API to POST a new chat message
                const response = await fetch("/api/v1/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + idToken
                    },
                    body: JSON.stringify({
                        message: messageText
                    })
                    }
                );

                // Messages are handled asynchronously, so the client should just receive back a 201 Created rather than a chat message directly
                if (response.status === 201) {
                    // If request was successful, response body will be the chat ID - return it
                    const data = await response.json();
                    return data.chatId;
                } else {
                    // If request was unsuccessful, response body will be the error ("message")
                    const data = await response.json();
                    throw new Error(data.message || "Chat message failed");
                }
            }

            // Performs a single check for the reply to a chat message using the chat ID
            async function getReply(chatId) {
                // Request the chat reply and include the JWT
                const idToken = sessionStorage.getItem("idToken");
                const response = await fetch("/api/v1/reply?chatId=" + encodeURIComponent(chatId), {
                    headers: { "Authorization": "Bearer " + idToken }
                });

                if (response.status === 401) throw new Error("Session expired, please log in again");
                if (!response.ok) throw new Error("Could not get reply (" + response.status + ")");
                return await response.json();
            }

            // Helper function to implement "sleep"
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            // Poll until the reply is ready, the chat fails, or the client-side timeout is reached
            // Errors returned from this function are inserted into the chatbot thread for the user to read
            async function waitForReply(chatId, intervalMs=2000, timeoutMs=60000) {
                const deadline = Date.now() + timeoutMs;

                // Repeat polling of "pending" status until timeout is hit
                while (Date.now() < deadline) {
                    await sleep(intervalMs);

                    const result = await getReply(chatId);
                    if (result.status === "completed") return result.chatReply;
                    if (result.status === "failed") throw new Error("The assistant could not answer that message.");
                }

                // Throw an error if the timeout is hit
                throw new Error("The assistant is taking longer than expected, please try again.");
            }

            // Submit login
            document.getElementById("log_in").addEventListener("click", async () => {
                console.log("Attempting log in...");

                // Get credentials from the webpage form
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                try {
                    await login(username, password);

                    // If login is successful, hide login form and show user area (account)
                    document.getElementById("login_form").setAttribute("hidden", "");
                    document.getElementById("user_area").removeAttribute("hidden");

                    // Fetch and show the account balance
                    await loadBalance();
                } catch (err) {
                    console.error("Login failed:", err);
                    alert("Login failed: " + err.message);
                }
            });

            // Submit logout
            document.getElementById("log_out").addEventListener("click", async () => {await logout()});

            // Open chatbot
            document.getElementById("chatbot").addEventListener("click", async () => {
                // Change chatbot color to indicate it is opened
                document.getElementById("chatbot").setAttribute("style", "background-color: slateblue;");

                // Show the chatbot area with the conversation thread and related options
                document.getElementById("chatbot_area").removeAttribute("hidden");

                // Initiate AI session to Lambda
                
            });

            // Add "Send Message" button listener
            document.getElementById("send_message").addEventListener("click", async () => {
                // Empty the input field and add message to conversation
                const messageText = document.getElementById("user_message_draft").value.toString().trim();
                if (messageText.length < 1) {throw new Error("Message has no content");}
                document.getElementById("user_message_draft").value = "";
                let messageElement = document.createElement("p");
                messageElement.setAttribute("class", "user_message");
                messageElement.innerText = messageText;
                document.getElementById("chatbot_thread").appendChild(messageElement);
                
                // Block further sends until this one finishes
                document.getElementById("send_message").disabled = true;

                // Initialize chatId outside the try block because it is referenced later
                let chatId;

                // Send the message
                // Messages are handled asynchronously, so the client should just receive back a 201 Created rather than a chat message directly
                try {
                    // sendMessage returns the message ID of the submitted chat message
                    chatId = await sendMessage(messageText);
                } catch (err) {
                    // Release hold on the "Send Message" button
                    document.getElementById("send_message").disabled = false;

                    console.error("Could not send chatbot message: " + err.message);
                    throw new Error("Could not send chatbot message: " + err.message); // breaks execution here if message could not be sent
                }

                // Get the message reply
                try {
                    // Add a placeholder reply
                    let replyElement = document.createElement("p");
                    replyElement.setAttribute("class", "ai_message");
                    replyElement.innerText = "Thinking...";
                    document.getElementById("chatbot_thread").appendChild(replyElement);

                    // Get the message reply
                    const chatReply = await waitForReply(chatId);
                    if (chatReply === null) return; // logged out; the UI was already reset
                    
                    // Replace the placeholder message with the actual reply
                    replyElement.innerText = chatReply;
                } catch (err) {
                    console.error("Chat failed:", err);

                    // Add an error reply
                    let errorElement = document.createElement("p");
                    errorElement.setAttribute("class", "error_message");
                    errorElement.innerText = err;
                    document.getElementById("chatbot_thread").appendChild(errorElement);
                } finally {
                    // Release hold on the "Send Message" button
                    document.getElementById("send_message").disabled = false;
                }
            });
        </script>
    </body>
</html>
